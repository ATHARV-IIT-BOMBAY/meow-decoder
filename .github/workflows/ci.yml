name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests fake the audio models, so skip torch/transformers/avex.
      - run: pip install --no-deps -e . && pip install numpy scikit-learn soundfile fastapi uvicorn python-multipart httpx pytest
      - run: pytest -q
