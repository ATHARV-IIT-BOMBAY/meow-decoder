# The browser-only app on GitHub Pages: meow_decoder/static plus web/ (the engine that replaces the server).
name: Pages
on:
  push:
    branches: [main]
    paths: ["meow_decoder/static/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R meow_decoder/static/. _site/
          cp web/engine.js web/dsp.js web/model.json _site/
          sed -i 's|<head>|<head><script>window.MEOW_LOCAL = true</script>|' _site/index.html
          grep -q "window.MEOW_LOCAL = true" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
